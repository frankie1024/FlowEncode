name: 功能建议
description: 为 FlowEncode 提出改进建议或新的工作流需求。
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请先描述当前工作流中的问题，再说明希望 FlowEncode 如何改进。

  - type: textarea
    id: problem
    attributes:
      label: 工作流问题
      description: 当前在压制、转码、VapourSynth 或工具链流程中哪里不好用？
      placeholder: "当我想要 ... 时，现在必须 ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 FlowEncode 增加或修改什么？
      placeholder: "希望增加一个选项、页面或操作，用于 ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 目前替代方案
      description: 现在是否可以通过命令行、脚本或手动步骤解决？

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      description: 这个建议主要涉及 FlowEncode 的哪个部分？
      options:
        - 工作台 / 导航
        - VapourSynth 工作区
        - 视频压制
        - 自动压制 / Av1an
        - 音频转码
        - 蓝光解复用
        - 模板库
        - 环境引导
        - 设置 / 更新
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: toolchain
    attributes:
      label: 相关工具链
      description: 如果该建议依赖特定外部工具、编码器、插件或运行时，请在这里列出。
      placeholder: "FFmpeg / VapourSynth / Av1an / x264 / x265 / SVT-AV1 / 其他"

  - type: textarea
    id: examples
    attributes:
      label: 示例或参考
      description: 如果有帮助，可以贴相关工具、截图、命令示例或同类实现。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索过现有 issues，确认不是重复建议。
          required: true
        - label: 这个建议是关于 FlowEncode 本身，而不是无关上游工具的一般使用支持。
          required: true
